name: Android Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;4.1.2" "ndk;27.2.12479018"

      - name: Prepare LibreOfficeKit Android runtime
        shell: bash
        run: |
          set -euo pipefail

          LO_APK_URL="https://f-droid.org/repo/org.documentfoundation.libreoffice_131.apk"

          rm -rf /tmp/libreoffice-runtime
          mkdir -p /tmp/libreoffice-runtime
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets

          curl --fail --location --retry 3 --output /tmp/libreoffice.apk "$LO_APK_URL"

          unzip -q /tmp/libreoffice.apk 'lib/arm64-v8a/*' -d /tmp/libreoffice-runtime
          unzip -q /tmp/libreoffice.apk 'assets/*' -d /tmp/libreoffice-runtime

          cp /tmp/libreoffice-runtime/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp -R /tmp/libreoffice-runtime/assets/. app/src/main/assets/

          test -s app/src/main/jniLibs/arm64-v8a/liblo-native-code.so
          test -d app/src/main/assets/program
          test -d app/src/main/assets/unpack
          test -s app/src/main/assets/unpack/program/udkapi.rdb

          echo "Verified Android LibreOfficeKit bootstrap payload:"
          ls -lh app/src/main/assets/unpack/program/udkapi.rdb
          echo "LibreOffice runtime assets:"
          du -sh app/src/main/assets

          echo "Checking native libraries for 16 KiB ELF LOAD alignment..."
          if command -v llvm-readelf >/dev/null 2>&1; then
            READ_ELF="llvm-readelf"
          elif command -v readelf >/dev/null 2>&1; then
            READ_ELF="readelf"
          else
            echo "ERROR: no ELF reader available"
            exit 1
          fi

          while IFS= read -r so; do
            while IFS= read -r align; do
              [ -n "$align" ] || continue
              if [ "$((align))" -lt 16384 ]; then
                echo "ERROR: 16 KiB alignment check failed: $so (LOAD align=$align)"
                "$READ_ELF" -lW "$so" | grep ' LOAD ' || true
                exit 1
              fi
            done < <("$READ_ELF" -lW "$so" | awk '$1=="LOAD" {print $NF}')
          done < <(find app/src/main/jniLibs -type f -name '*.so' -print)

          echo "16 KiB ELF alignment check passed."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify packaged LibreOffice bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -E 'assets/(program|unpack)/' | head -n 20
          unzip -l "$APK" | grep -q 'assets/unpack/program/udkapi.rdb'
          unzip -l "$APK" | grep -q 'assets/program/fundamentalrc'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/liblo-native-code.so'
          echo "APK contains required LibreOffice bootstrap payload."

      - uses: actions/upload-artifact@v4
        with:
          name: docuflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
